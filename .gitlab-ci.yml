# Self-contained pipeline — this repository is publicly mirrored, so no
# includes of internal CI templates and no internal hostnames; the registry
# is always addressed through GitLab's predefined variables.

stages: [lint, test, build, publish]

lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install --quiet ruff
    - ruff check src tests
    - bash scripts/check-public-hygiene.sh

helm_lint:
  stage: lint
  image:
    name: alpine/helm:3.14.4
    entrypoint: [""]
  script:
    - helm lint helm/shinrai-engine
    - helm template t helm/shinrai-engine > /dev/null
    - helm template t helm/shinrai-engine
        --set gpu.enabled=true
        --set persistence.enabled=true
        --set apiKey.value=ci-check
        --set ingress.enabled=true
        --set 'ingress.hosts[0].host=example.com'
        --set 'ingress.hosts[0].paths[0]=/' > /dev/null

test:
  stage: test
  image: python:3.12
  script:
    - pip install -e ".[dev]"
    - pytest -q

.kaniko: &kaniko
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - >-
      printf '{"auths":{"%s":{"auth":"%s"}}}'
      "$CI_REGISTRY" "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
      > /kaniko/.docker/config.json

build_cpu:
  <<: *kaniko
  script:
    - >-
      /kaniko/executor --context "$CI_PROJECT_DIR"
      --dockerfile docker/Dockerfile.cpu
      $EXTRA_DESTINATIONS
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
      variables:
        EXTRA_DESTINATIONS: --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" --destination "$CI_REGISTRY_IMAGE:latest"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        EXTRA_DESTINATIONS: --no-push

build_gpu:
  <<: *kaniko
  script:
    - >-
      /kaniko/executor --context "$CI_PROJECT_DIR"
      --dockerfile docker/Dockerfile.gpu
      $EXTRA_DESTINATIONS
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA-gpu"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
      variables:
        EXTRA_DESTINATIONS: --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-gpu" --destination "$CI_REGISTRY_IMAGE:latest-gpu"
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

chart_package:
  stage: build
  image:
    name: alpine/helm:3.14.4
    entrypoint: [""]
  script:
    - helm package helm/shinrai-engine --destination chart-dist
  artifacts:
    paths: [chart-dist/]
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# Publishes release images to the public registry so self-hosters can pull
# without building. Runs only on version tags AND only when the GHCR
# credentials exist as CI variables (masked+protected): GHCR_USER, GHCR_TOKEN.
publish_ghcr:
  stage: publish
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  script:
    - crane auth login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - crane auth login ghcr.io -u "$GHCR_USER" -p "$GHCR_TOKEN"
    - crane copy "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" "ghcr.io/innovius-ai/shinrai-engine:$CI_COMMIT_TAG"
    - crane copy "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" "ghcr.io/innovius-ai/shinrai-engine:latest"
    - crane copy "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-gpu" "ghcr.io/innovius-ai/shinrai-engine:$CI_COMMIT_TAG-gpu"
    - crane copy "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-gpu" "ghcr.io/innovius-ai/shinrai-engine:latest-gpu"
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/ && $GHCR_USER && $GHCR_TOKEN'
