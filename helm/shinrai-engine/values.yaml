# shinrai-engine — a plain `helm install` with these defaults works on a
# stock microk8s: CPU image, fp32, model downloaded from Hugging Face on
# first start into an emptyDir. Two switches you almost certainly want:
#   persistence.enabled=true   keep the ~1.3 GB model across pod restarts
#                              (microk8s: `microk8s enable hostpath-storage`)
#   apiKey.*                   without it /api/* is open to the cluster

image:
  repository: ghcr.io/innovius-ai/shinrai-engine
  # Defaults to the chart appVersion; gpu.enabled=true appends "-gpu" unless
  # a tag is set explicitly.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

gpu:
  enabled: false
  # microk8s GPU operator usually schedules fine without it; set to "nvidia"
  # if your cluster requires an explicit RuntimeClass.
  runtimeClassName: ""
  nodeSelector: {}
  tolerations: []

model:
  # Comma-separated name=source list; source is hf://org/repo[@rev] or an
  # absolute path inside the pod. First entry is the default model.
  sources: "v1.1=hf://innovius/shinrai-pii-pathfinder-m-v1.1"
  # fp32 | q8 | int4 — anything but fp32 prints the precision warning into
  # the release NOTES and the service reports it on /healthz. fp32 is the
  # only supported production precision.
  precision: fp32
  allowInt4: false
  # Secret holding an HF token for private repos (e.g. v1.2 today).
  hfTokenSecret:
    name: ""
    key: token

persistence:
  enabled: false
  size: 5Gi
  # Empty = cluster default StorageClass (microk8s: microk8s-hostpath after
  # `microk8s enable hostpath-storage`).
  storageClass: ""
  existingClaim: ""

apiKey:
  # Either reference an existing Secret...
  existingSecret: ""
  secretKey: api-key
  # ...or let the chart create one with this value (weaker: the key then
  # lives in your values/history).
  value: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  # - host: engine.example.com
  #   paths: ["/"]
  tls: []

resources:
  # fp32 needs ~1.5-2 GiB RSS per loaded model.
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    cpu: "4"
    memory: 4Gi

# Extra environment for the container (map of NAME: value). SHINRAI_THREADS
# defaults to the CPU limit's whole cores if unset here.
env:
  SHINRAI_THREADS: "4"

probes:
  # The startup budget covers a cold ~1.3 GB download plus the fp32 load.
  startup:
    path: /healthz
    periodSeconds: 10
    failureThreshold: 60
  readiness:
    path: /healthz
    periodSeconds: 10
  liveness:
    path: /healthz
    periodSeconds: 30

replicaCount: 1

podSecurityContext:
  runAsNonRoot: true

nodeSelector: {}
tolerations: []
affinity: {}
