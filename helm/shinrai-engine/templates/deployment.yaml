apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "shinrai-engine.fullname" . }}
  labels:
    {{- include "shinrai-engine.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if .Values.persistence.enabled }}
  # A RWO model volume cannot be shared by two pods during a rolling swap.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "shinrai-engine.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "shinrai-engine.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if and .Values.gpu.enabled .Values.gpu.runtimeClassName }}
      runtimeClassName: {{ .Values.gpu.runtimeClassName }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: engine
          image: "{{ .Values.image.repository }}:{{ include "shinrai-engine.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SHINRAI_MODELS
              value: {{ .Values.model.sources | quote }}
            - name: SHINRAI_PRECISION
              value: {{ .Values.model.precision | quote }}
            {{- if .Values.model.allowInt4 }}
            - name: SHINRAI_ALLOW_INT4
              value: "1"
            {{- end }}
            {{- if include "shinrai-engine.authEnabled" . }}
            - name: SHINRAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "shinrai-engine.apiKeySecretName" . }}
                  key: {{ .Values.apiKey.secretKey }}
            {{- end }}
            {{- if .Values.model.hfTokenSecret.name }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.model.hfTokenSecret.name }}
                  key: {{ .Values.model.hfTokenSecret.key }}
            {{- end }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: models
              mountPath: /models
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          resources:
            {{- if .Values.gpu.enabled }}
            requests:
              {{- toYaml .Values.resources.requests | nindent 14 }}
              nvidia.com/gpu: 1
            limits:
              {{- toYaml .Values.resources.limits | nindent 14 }}
              nvidia.com/gpu: 1
            {{- else }}
            {{- toYaml .Values.resources | nindent 12 }}
            {{- end }}
      volumes:
        - name: models
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-models" (include "shinrai-engine.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- $nodeSelector := .Values.nodeSelector }}
      {{- if .Values.gpu.enabled }}{{ $nodeSelector = merge (deepCopy .Values.gpu.nodeSelector) .Values.nodeSelector }}{{ end }}
      {{- with $nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $tolerations := .Values.tolerations }}
      {{- if .Values.gpu.enabled }}{{ $tolerations = concat .Values.gpu.tolerations .Values.tolerations }}{{ end }}
      {{- with $tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
