[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shinrai-engine"
version = "0.1.1"
description = "Self-hostable HTTP inference service for the ShinrAI PII detection models (ONNX, CPU/GPU)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Innovius" }]
# onnxruntime is installed via the [cpu] or [gpu] extra so the CPU and CUDA
# wheels never end up side by side in one environment.
dependencies = [
    "numpy==2.5.1",
    "transformers==4.57.6",
    "huggingface_hub>=0.34",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The exact onnxruntime the model bundles were exported and validated with.
cpu = ["onnxruntime==1.28.0"]
# Last CUDA-12 wheel line. onnxruntime-gpu >= 1.27 is built for CUDA 13,
# which dropped Pascal — see docker/Dockerfile.gpu for the full story.
gpu = ["onnxruntime-gpu==1.26.*"]
dev = [
    "shinrai-engine[cpu]",
    "pytest>=8.0",
    "ruff>=0.4",
    "onnx>=1.22",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Innovius-ai/shinrai-engine"
Issues = "https://github.com/Innovius-ai/shinrai-engine/issues"
Models = "https://huggingface.co/innovius"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shinrai_engine = ["golden/*.json"]

[tool.pytest.ini_options]
markers = ["slow: needs a real model bundle (set SHINRAI_TEST_MODEL_DIR)"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Generated by shinrai-pii-bert's scripts/vendor-engine.sh — never hand-edited,
# so never linted here.
extend-exclude = ["src/shinrai_pii_runtime"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
